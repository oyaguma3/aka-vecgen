# テスト、イメージのビルド、README の手順の通し確認を行う。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同じブランチで新しく push したら、古い実行は止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # internal/store と internal/adminapi の結合テストに使う（パッケージごとに論理データベースを分けている）。
      valkey:
        image: valkey/valkey:9.1.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VECGEN_TEST_VALKEY_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 整形の確認
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイル:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: テスト（Valkey の結合テストを含む）
        run: go test -race -count=1 ./...
      - name: Valkey の結合テストが実行されたことの確認
        run: |
          # 接続先がなければ結合テストはスキップされ、テスト自体は成功してしまうので、別に確かめる。
          set -o pipefail
          go test -count=1 -v ./internal/store/ ./internal/adminapi/ | tee integration.log
          if grep -q -- '--- SKIP' integration.log; then
            echo "Valkey の結合テストがスキップされました"
            exit 1
          fi

  docker:
    name: イメージと compose の設定
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: イメージのビルド
        run: docker build --build-arg VERSION="${GITHUB_SHA::7}" -t aka-vecgen:ci .
      - name: compose の設定
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose config --services

  readme:
    name: README の手順の通し確認
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # 以下は README の「起動」「クライアントと加入者の登録」「認証ベクターの取得」と同じ手順。
      - name: 起動
        run: |
          cp .env.example .env
          sed -i "s|^VALKEY_PASSWORD=.*|VALKEY_PASSWORD=ci-$(openssl rand -hex 12)|" .env
          # aka-vecgen と Valkey が healthy になるまで待つ（compose の healthcheck の確認を兼ねる）。
          docker compose up -d --build --wait --wait-timeout 120
      - name: クライアントと加入者の登録
        run: |
          docker compose exec -T aka-vecgen /aka-vecgen client gen-cert -name radius > radius.pem
          docker compose exec -T aka-vecgen /aka-vecgen client add -name radius -cert - < radius.pem
          docker compose exec -T aka-vecgen /aka-vecgen subscriber add -imsi 440100123456789 -ki 465b5ce8b199b49faa5f0a2ee238a6bc -opc cd63cb71954a9f4e48a5994e37a02baf -clients 1
          docker compose exec -T aka-vecgen /aka-vecgen av-cert > server.pem
      - name: 認証ベクターの取得（eap-aka / umts-aka / eap-aka-prime）
        run: |
          get() {
            # EAP-AKA' では anId（ネットワーク名）が必須（認証ベクターAPI の契約 §6.4）。
            extra=""
            if [ "$2" = EAP_AKA_PRIME ]; then extra=',"anId":"WLAN"'; fi
            curl -sS --fail-with-body --retry 10 --retry-delay 2 --retry-all-errors \
              --cacert server.pem --cert radius.pem -X POST \
              "https://localhost:8443/nudm-ueau/v1/imsi-440100123456789/hss-security-information/$1/generate-av" \
              -d "{\"hssAuthType\":\"$2\",\"numOfRequestedVectors\":$3$extra}"
          }
          check() {
            # 要求した数のベクターがあり、鍵（CK / IK または CK' / IK'）が入っていること。
            echo "$1" | jq -e --argjson n "$2" --arg ck "$3" --arg ik "$4" \
              '(.hssAuthenticationVectors | length) == $n and all(.hssAuthenticationVectors[]; (.[$ck] | length) == 32 and (.[$ik] | length) == 32 and (.autn | length) == 32)'
          }
          check "$(get eap-aka EAP_AKA 1)" 1 ck ik
          check "$(get umts-aka UMTS_AKA 3)" 3 ck ik
          check "$(get eap-aka-prime EAP_AKA_PRIME 1)" 1 ckPrime ikPrime
      - name: 登録したクライアント以外は接続できないこと
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj /CN=stranger -keyout stranger-key.pem -out stranger.pem 2>/dev/null
          if curl -sS --cacert server.pem --cert stranger.pem --key stranger-key.pem -X POST \
              https://localhost:8443/nudm-ueau/v1/imsi-440100123456789/hss-security-information/eap-aka/generate-av \
              -d '{"hssAuthType":"EAP_AKA","numOfRequestedVectors":1}'; then
            echo "未登録のクライアントが接続できてしまいました"
            exit 1
          fi
      - name: ログ（失敗時）
        if: failure()
        run: docker compose logs --no-color

  conformance:
    name: 認証ベクターAPI の適合試験
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      valkey:
        image: valkey/valkey:9.1.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 適合試験（aka-mvpset の conformance/av-api）のコミット。契約や適合試験を変えたら、その main のコミットに更新する。
      MVPSET_REF: 3477e863b52b65a851cd453d08b180b1bba83208
      VECGEN_VALKEY_ADDR: localhost:6379
      VECGEN_AV_TLS_ADDR: 127.0.0.1:18443
      VECGEN_AV_TLS_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: oyaguma3/aka-mvpset
          ref: ${{ env.MVPSET_REF }}
          path: aka-mvpset
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: ビルド
        run: |
          git -C aka-mvpset log -1 --format='aka-mvpset: %h %s'
          go build -o "$RUNNER_TEMP/aka-vecgen" ./cmd/aka-vecgen
          go -C aka-mvpset/conformance/av-api build -o "$RUNNER_TEMP/av-conformance" ./cmd/av-conformance
      - name: 試験用のクライアントと加入者の投入
        working-directory: ${{ runner.temp }}
        run: sh "$GITHUB_WORKSPACE/aka-mvpset/conformance/av-api/fixtures/aka-vecgen.sh" out ./av-conformance ./aka-vecgen
      - name: aka-vecgen の起動
        working-directory: ${{ runner.temp }}
        run: |
          nohup ./aka-vecgen serve > vecgen.log 2>&1 &
          for i in $(seq 1 30); do
            ./aka-vecgen healthcheck 2>/dev/null && ./aka-vecgen av-cert > server.pem && exit 0
            sleep 1
          done
          exit 1
      - name: 適合試験
        working-directory: ${{ runner.temp }}
        run: ./av-conformance -url https://127.0.0.1:18443/nudm-ueau/v1 -ca server.pem -cert-a out/client-a.pem -cert-b out/client-b.pem
      - name: ログ（失敗時）
        if: failure()
        working-directory: ${{ runner.temp }}
        run: cat vecgen.log
