openapi: 3.0.3
info:
  title: aka-vecgen 認証ベクターAPI
  version: 0.2.0-draft
  description: |
    Milenage による AKA 認証ベクターを払い出す API。

    3GPP TS 29.503 Nudm_UEAU の GenerateAv（HSS 連携用）をベースにしている。
    パス、項目名、値の範囲は TS 29.503 v18.4.0 の OpenAPI 定義に合わせた。

    TS 29.503 との差分:
    - OAuth2.0 と NRF 連携は実装しない。
    - 対応する認証タイプは EAP_AKA、UMTS_AKA、EAP_AKA_PRIME のみ。
    - パスの `umts-aka` は TS 29.503 の列挙値にはない独自の拡張。
    - `supportedFeatures`、`requestingNodeType`、`servingNetworkId` は受け取るが使わない。

    クライアントの識別とアクセス制御:
    - mTLS リスナーでは、登録済みのクライアント証明書が必須。
      証明書なし、または未登録の証明書による接続は TLS ハンドシェイクで拒否する。
      クライアントが加入者の許可クライアントに含まれていなければ 403 を返す。
    - 平文HTTP リスナー（既定で無効）では、加入者の平文HTTP許可フラグが立っていなければ 403 を返す。

    トレースID（0.2.0-draft）:
    - クライアントは `X-Trace-ID` ヘッダーでトレースID を渡せる。サーバーはそれを払い出しのログ（`trace_id`）に残し、
      応答の `X-Trace-ID` ヘッダーで返す（エラーの応答を含む）。省略した場合や形式が違う場合は、サーバーが採番する。
      本PoC（eapaka-radius-server-poc）の vector-gateway が付けるトレースID と、1 回の認証の記録を突き合わせるため。管理API と同じ作法。

servers:
  - url: https://{host}:{port}/nudm-ueau/v1
    description: mTLS リスナー
    variables:
      host:
        default: localhost
      port:
        default: '8443'
  - url: http://{host}:{port}/nudm-ueau/v1
    description: 平文HTTP リスナー（既定で無効）
    variables:
      host:
        default: localhost
      port:
        default: '8080'

paths:
  /{supi}/hss-security-information/{hssAuthType}/generate-av:
    post:
      summary: 認証ベクターを生成する
      operationId: GenerateAv
      description: |
        指定した加入者の認証ベクターを `numOfRequestedVectors` 個生成し、加入者の SQN を進める。

        `resynchronizationInfo` がある場合は再同期として扱う。
        AUTS を検証して SQN_MS を取り出し、加入者の SQN を置き換えてからベクターを生成する。
      parameters:
        - name: supi
          in: path
          required: true
          description: 加入者の SUPI。`imsi-<IMSI>` 形式のみ対応する。
          schema:
            $ref: '#/components/schemas/Supi'
        - name: hssAuthType
          in: path
          required: true
          description: 認証タイプ。リクエストボディの `hssAuthType` と対応していなければ 400 を返す。
          schema:
            $ref: '#/components/schemas/HssAuthTypeInUri'
        - name: X-Trace-ID
          in: header
          required: false
          description: |
            トレースID（0.2.0-draft）。払い出しのログの `trace_id` に使う。省略時、または形式が違う（印字可能ASCII 1〜64文字でない）場合は
            サーバーが採番する（16進32桁）。使った値を応答の `X-Trace-ID` ヘッダーで返す（エラーの応答を含む）。
          schema:
            type: string
            pattern: '^[\x21-\x7E]{1,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HssAuthenticationInfoRequest'
            examples:
              eapAka:
                summary: EAP-AKA のベクターを1個
                value:
                  hssAuthType: EAP_AKA
                  numOfRequestedVectors: 1
              eapAkaPrimeResync:
                summary: EAP-AKA' の再同期
                value:
                  hssAuthType: EAP_AKA_PRIME
                  numOfRequestedVectors: 1
                  anId: WLAN
                  resynchronizationInfo:
                    rand: 23553cbe9637a89d218ae64dae47bf35
                    auts: ba853f3c123c01cfaf9ec4e871e9
      responses:
        '200':
          description: 生成した認証ベクター
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HssAuthenticationInfoResult'
              examples:
                eapAka:
                  value:
                    hssAuthenticationVectors:
                      - avType: EAP_AKA
                        rand: 23553cbe9637a89d218ae64dae47bf35
                        xres: a54211d5e3ba50bf
                        autn: 55f328b43577b9b94a9ffac354dfafb3
                        ck: b40ba9a3c58b2a05bbf0d987b21bf8cb
                        ik: f769bcd751044604127672711c6d3441
        '400':
          description: |
            リクエストが不正。`cause` は次のいずれか。
            - `INVALID_MSG_FORMAT`: JSON として解釈できない
            - `MANDATORY_IE_MISSING`: 必須項目がない
            - `MANDATORY_IE_INCORRECT`: 必須項目の値が不正、またはパスとボディの `hssAuthType` が対応していない
            - `OPTIONAL_IE_INCORRECT`: 任意項目の値が不正、または `anId` がサーバー側の設定値と一致しない
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: |
            払い出しを拒否した。`cause` は `AUTHENTICATION_REJECTED`。
            - クライアントが加入者の許可クライアントに含まれていない
            - 平文HTTP で、加入者の平文HTTP許可フラグが立っていない
            - 再同期で AUTS の検証に失敗した
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: 加入者が存在しない。`cause` は `USER_NOT_FOUND`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: サーバー内部のエラー。`cause` は `SYSTEM_FAILURE`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '501':
          description: 対応していない認証タイプ（EPS_AKA、IMS_AKA、GBA_AKA）。`cause` は `AUTH_TYPE_NOT_SUPPORTED`（独自）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    Supi:
      type: string
      pattern: '^imsi-[0-9]{5,15}$'
      example: imsi-440100123456789

    HssAuthTypeInUri:
      type: string
      enum:
        - eap-aka
        - eap-aka-prime
        - umts-aka

    HssAuthType:
      type: string
      enum:
        - EAP_AKA
        - EAP_AKA_PRIME
        - UMTS_AKA

    HssAuthenticationInfoRequest:
      type: object
      required:
        - hssAuthType
        - numOfRequestedVectors
      properties:
        hssAuthType:
          $ref: '#/components/schemas/HssAuthType'
        numOfRequestedVectors:
          $ref: '#/components/schemas/NumOfRequestedVectors'
        resynchronizationInfo:
          $ref: '#/components/schemas/ResynchronizationInfo'
        anId:
          $ref: '#/components/schemas/AccessNetworkId'
        requestingNodeType:
          type: string
          description: 受け取るが使わない。
        servingNetworkId:
          type: object
          description: 受け取るが使わない。
        supportedFeatures:
          type: string
          description: 受け取るが使わない。

    NumOfRequestedVectors:
      type: integer
      minimum: 1
      maximum: 5

    ResynchronizationInfo:
      type: object
      required:
        - rand
        - auts
      properties:
        rand:
          $ref: '#/components/schemas/Rand'
        auts:
          $ref: '#/components/schemas/Auts'

    AccessNetworkId:
      type: string
      description: |
        EAP-AKA' の鍵導出に使う Network Name。`EAP_AKA_PRIME` 以外では無視する。
        省略時はサーバー側の設定値（クライアントごとの設定、なければ `WLAN`）を使う。
        指定した値がサーバー側の設定値と一致しなければ 400 を返す。
      example: WLAN

    HssAuthenticationInfoResult:
      type: object
      required:
        - hssAuthenticationVectors
      properties:
        hssAuthenticationVectors:
          $ref: '#/components/schemas/HssAuthenticationVectors'

    HssAuthenticationVectors:
      description: |
        `EAP_AKA` と `UMTS_AKA` では AvImsGbaEapAka の配列、`EAP_AKA_PRIME` では AvEapAkaPrime の配列を返す。
        配列は SQN の小さい順に並ぶ。
      oneOf:
        - type: array
          items:
            $ref: '#/components/schemas/AvImsGbaEapAka'
          minItems: 1
          maxItems: 5
        - type: array
          items:
            $ref: '#/components/schemas/AvEapAkaPrime'
          minItems: 1
          maxItems: 5

    AvImsGbaEapAka:
      type: object
      required:
        - avType
        - rand
        - xres
        - autn
        - ck
        - ik
      properties:
        avType:
          type: string
          enum:
            - EAP_AKA
            - UMTS_AKA
        rand:
          $ref: '#/components/schemas/Rand'
        xres:
          $ref: '#/components/schemas/Xres'
        autn:
          $ref: '#/components/schemas/Autn'
        ck:
          $ref: '#/components/schemas/Key128'
        ik:
          $ref: '#/components/schemas/Key128'

    AvEapAkaPrime:
      type: object
      required:
        - avType
        - rand
        - xres
        - autn
        - ckPrime
        - ikPrime
      properties:
        avType:
          type: string
          enum:
            - EAP_AKA_PRIME
        rand:
          $ref: '#/components/schemas/Rand'
        xres:
          $ref: '#/components/schemas/Xres'
        autn:
          $ref: '#/components/schemas/Autn'
        ckPrime:
          $ref: '#/components/schemas/Key128'
        ikPrime:
          $ref: '#/components/schemas/Key128'

    Rand:
      type: string
      pattern: '^[A-Fa-f0-9]{32}$'

    Auts:
      type: string
      pattern: '^[A-Fa-f0-9]{28}$'

    Autn:
      type: string
      pattern: '^[A-Fa-f0-9]{32}$'

    Xres:
      type: string
      description: Milenage の RES は 8 バイトなので、16 桁の16進文字列になる。
      pattern: '^[A-Fa-f0-9]{16}$'

    Key128:
      type: string
      pattern: '^[A-Fa-f0-9]{32}$'

    ProblemDetails:
      type: object
      description: TS 29.571 の ProblemDetails のうち、このサーバーが返す項目。
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        cause:
          type: string
          enum:
            - INVALID_MSG_FORMAT
            - MANDATORY_IE_MISSING
            - MANDATORY_IE_INCORRECT
            - OPTIONAL_IE_INCORRECT
            - AUTHENTICATION_REJECTED
            - USER_NOT_FOUND
            - SYSTEM_FAILURE
            - AUTH_TYPE_NOT_SUPPORTED
