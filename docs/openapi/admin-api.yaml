openapi: 3.0.3
info:
  title: aka-vecgen 管理API
  version: 2.0.0
  description: |
    加入者を操作し、AVクライアント・AV用サーバー証明書・監査ログを読み出す API。
    MVP セットでは、管理クライアントは aka-provisioner だけ（設計概要 §1）。

    2.0.0-draft（MVP セットの段階 2-1）:
    - パスを `/admin/v2` にした。0.2.0 との互換は持たない。
    - 加入者に状態（`active` / `inactive` / `terminated`）を足した。登録では状態が必須。
      状態の変更は `PUT /subscribers/{imsi}/state`、terminated からの戻しは `POST /subscribers/{imsi}/reinstate`。
      `active` は物理削除できず、`terminated` は変更できない（設計概要 §7）。
    - 平文HTTP をなくしたので、加入者の `allowPlain` と状態の `avPlainEnabled` を外した。
    - 登録の後に鍵（Ki・OPc）を変える口をなくした（変更の本文に `ki`・`opc` があれば 400）。

    2.0.0（MVP セットの段階 2-3）:
    - 加入者の一括取得 `POST /subscribers/batch-get` を足した（IMSI を 500 件まで。鍵は返さない）。
    - 鍵の読み出し `GET /subscribers/{imsi}/keys` は既定で無効にした（サーバーの `VECGEN_KEY_EXPORT=true` のときだけ。無効なら 404 `KEY_EXPORT_DISABLED`）。
    - AVクライアントと AV用サーバー証明書の書き込みの口（登録・変更・削除・証明書の差し替え）をなくした。
      ノードの上のコマンド（`aka-vecgen client ...`、`aka-vecgen av-cert ...`）で行い、この API は読み出しだけ（設計概要 §9.3）。
    - メモリーの中のログの口 `/logs` をなくした（ログはノードのログの仕組みで取りに行く）。
    - `/status` に、契約の版、管理用のサーバー証明書の期限、管理クライアントの識別名と読み込んだ日時を足した。

    認証:
    - 認証ベクターAPI とは別のポート、別のサーバー証明書で提供する。
    - mTLS 必須。サーバーのピンのファイル（1 行に 識別名=フィンガープリント）の管理クライアントの証明書だけを受け付ける。
      ピンのファイルは SIGHUP で読み直す（再起動しない）。同じ識別名に新旧 2 つの証明書を書ける。
      証明書なし、または未登録の証明書による接続は TLS ハンドシェイクで拒否する。
    - 管理クライアントは全権として扱う。ユーザーや権限の概念はこの API にはない。

    監査ログ:
    - 変更操作と Ki / OPc の取得は監査ログに記録する（Valkey の Stream と、ノードの日ごとのファイル）。
      コマンドの操作（操作者は `-operator`、管理クライアントは `cli`）、KEK の入れ替え、SIGHUP での読み直しも同じ監査ログに残る。
    - 管理クライアントは `X-Operator-Id` ヘッダーで操作者 ID を渡す。
      省略した場合、監査ログには管理クライアントの識別名だけが残る。

    トレース（0.2.0）:
    - 管理クライアントは `X-Trace-ID` ヘッダーでトレースID を渡せる。サーバーはそれをログ
      （`admin request completed`、`audit` 等の `trace_id`）と監査ログの `traceId` に残し、応答の `X-Trace-ID` ヘッダーで返す。
    - 省略した場合や形式が違う場合は、サーバーが採番する。本PoC（eapaka-radius-server-poc）の
      Provisioning API と同じ作法。

    表記:
    - 16進文字列は大文字・小文字のどちらも受け付け、小文字で返す。
    - 日時は RFC 3339 形式の UTC。
    - エラーは ProblemDetails（`application/problem+json`）で返す。

servers:
  - url: https://{host}:{port}/admin/v2
    variables:
      host:
        default: localhost
      port:
        default: '9443'

tags:
  - name: status
    description: サーバーの状態
  - name: subscribers
    description: 加入者
  - name: clients
    description: AVクライアント（認証ベクターAPI のクライアント）
  - name: av-server-certificate
    description: 認証ベクターAPI 用のサーバー証明書
  - name: logs
    description: 監査ログ

paths:
  /status:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [status]
      summary: サーバーの状態を取得する
      operationId: getStatus
      responses:
        '200':
          description: サーバーの状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '500':
          $ref: '#/components/responses/InternalError'

  /subscribers:
    parameters:
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [subscribers]
      summary: 加入者の一覧を取得する
      operationId: listSubscribers
      description: IMSI の辞書順で返す。Ki と OPc は含まない。
      parameters:
        - name: prefix
          in: query
          description: IMSI の前方一致条件。
          schema:
            type: string
            pattern: '^[0-9]{1,15}$'
        - name: cursor
          in: query
          description: 前のページの `nextCursor`。省略時は先頭から返す。
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: 加入者の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [subscribers]
      summary: 加入者を登録する
      operationId: createSubscriber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriberCreate'
            example:
              imsi: '440100123456789'
              ki: 465b5ce8b199b49faa5f0a2ee238a6bc
              opc: cd63cb71954a9f4e48a5994e37a02baf
              sqn: '000000000000'
              amf: '8000'
              sqnType: inc32
              state: active
              allowedClientIds: [1, 2]
      responses:
        '201':
          description: 登録した加入者。Ki と OPc は含まない。
          headers:
            Location:
              description: 登録した加入者の URI
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 同じ IMSI の加入者が既に存在する。`cause` は `SUBSCRIBER_ALREADY_EXISTS`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'

  /subscribers/{imsi}:
    parameters:
      - $ref: '#/components/parameters/Imsi'
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [subscribers]
      summary: 加入者を取得する
      operationId: getSubscriber
      description: Ki と OPc は含まない。
      responses:
        '200':
          description: 加入者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '404':
          $ref: '#/components/responses/SubscriberNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [subscribers]
      summary: 加入者を変更する
      operationId: updateSubscriber
      description: |
        指定した項目だけを変更する（JSON Merge Patch）。
        `allowedClientIds` を指定した場合は、集合全体を置き換える。
        鍵（`ki`・`opc`）と状態（`state`）は変えられない（指定すると 400 の `OPTIONAL_IE_INCORRECT`）。
        `terminated` の加入者は変更できない（409）。
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/SubscriberUpdate'
            example:
              amf: '8000'
              allowedClientIds: [1, 3]
      responses:
        '200':
          description: 変更後の加入者。Ki と OPc は含まない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SubscriberNotFound'
        '409':
          description: 加入者が `terminated` で変更できない。`cause` は `SUBSCRIBER_TERMINATED`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [subscribers]
      summary: 加入者を物理削除する
      operationId: deleteSubscriber
      description: |
        `active` の加入者は削除できない（先に `inactive` か `terminated` にする）。
        削除時点の状態、SQN、AMF、SQN 増加タイプを監査ログに記録する。
      responses:
        '204':
          description: 削除した
        '404':
          $ref: '#/components/responses/SubscriberNotFound'
        '409':
          description: 加入者が `active` で削除できない。`cause` は `SUBSCRIBER_ACTIVE`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'

  /subscribers/{imsi}/state:
    parameters:
      - $ref: '#/components/parameters/Imsi'
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    put:
      tags: [subscribers]
      summary: 加入者の状態を変える
      operationId: setSubscriberState
      description: |
        `active` ⇔ `inactive`、`active` / `inactive` → `terminated` に変える。
        `terminated` からは変えられない（`POST /subscribers/{imsi}/reinstate` を使う）。
        同じ状態への変更は何もせず 200 を返し、監査ログ（`subscriber.state`、`unchanged`）には残す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChange'
            example:
              state: inactive
              reason: 料金の未払い
      responses:
        '200':
          description: 変更後の加入者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SubscriberNotFound'
        '409':
          description: 状態の移り方の規則で許されない（`terminated` からの変更）。`cause` は `STATE_TRANSITION_NOT_ALLOWED`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'

  /subscribers/{imsi}/reinstate:
    parameters:
      - $ref: '#/components/parameters/Imsi'
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    post:
      tags: [subscribers]
      summary: terminated の加入者を inactive に戻す
      operationId: reinstateSubscriber
      description: |
        理由は必須で、監査ログ（`subscriber.reinstate`）に残す。
        システム管理者だけに許すことは呼び出し側（aka-ossbss）が守る。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reinstate'
            example:
              reason: 誤って解約した
      responses:
        '200':
          description: 戻した後の加入者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/SubscriberNotFound'
        '409':
          description: 加入者が `terminated` でない。`cause` は `STATE_TRANSITION_NOT_ALLOWED`。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'

  /subscribers/batch-get:
    parameters:
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    post:
      tags: [subscribers]
      summary: 加入者を一括で取得する
      operationId: batchGetSubscribers
      description: |
        IMSI を 1〜500 件受け取り、ある加入者（鍵を除く）と、ない IMSI を返す（設計概要 §6.2）。
        重なった IMSI は 1 つにまとめ、どちらも要求の順に返す。台帳との突き合わせと一括投入の前の確かめに使う。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGetRequest'
      responses:
        '200':
          description: ある加入者と、ない IMSI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGetResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /subscribers/{imsi}/keys:
    parameters:
      - $ref: '#/components/parameters/Imsi'
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [subscribers]
      summary: 加入者の Ki と OPc を取得する
      operationId: getSubscriberKeys
      description: |
        既定で無効。サーバーの `VECGEN_KEY_EXPORT=true` のときだけ使える（別の生成源への移し替えのような、まれな作業のため。設計概要 §8.4）。
        この操作は監査ログに記録する。
      responses:
        '200':
          description: Ki と OPc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberKeys'
        '404':
          description: |
            加入者が存在しない（`cause` は `USER_NOT_FOUND`）、または鍵の読み出しが無効（`cause` は `KEY_EXPORT_DISABLED`）。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients:
    parameters:
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [clients]
      summary: AVクライアントの一覧を取得する
      operationId: listClients
      description: クライアントID の昇順で全件を返す。
      responses:
        '200':
          description: AVクライアントの一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientList'
        '500':
          $ref: '#/components/responses/InternalError'

  /clients/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [clients]
      summary: AVクライアントを取得する
      operationId: getClient
      responses:
        '200':
          description: AVクライアント
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          $ref: '#/components/responses/ClientNotFound'
        '500':
          $ref: '#/components/responses/InternalError'


  /av-server-certificate:
    parameters:
      - $ref: '#/components/parameters/OperatorId'
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [av-server-certificate]
      summary: 現在の AV用サーバー証明書を取得する
      operationId: getAvServerCertificate
      description: 秘密鍵は返さない。
      responses:
        '200':
          description: 現在のサーバー証明書
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerCertificate'
        '500':
          $ref: '#/components/responses/InternalError'


  /audit-logs:
    parameters:
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [logs]
      summary: 監査ログを取得する
      operationId: listAuditLogs
      description: 新しい順に返す。続きを取得するには、応答の `nextBefore` を次の `before` に渡す。
      parameters:
        - name: before
          in: query
          description: このエントリID より古いものを返す。省略時は最新から返す。
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: 監査ログ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    Imsi:
      name: imsi
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Imsi'
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ClientId'
    OperatorId:
      name: X-Operator-Id
      in: header
      required: false
      description: 操作者 ID。監査ログに記録する。
      schema:
        type: string
        pattern: '^[A-Za-z0-9._@-]{1,64}$'
    TraceId:
      name: X-Trace-ID
      in: header
      required: false
      description: |
        トレースID。ログの `trace_id` と監査ログの `traceId` に使う。省略時、または形式が違う（印字可能ASCII 1〜64文字でない）場合は
        サーバーが採番する（16進32桁）。使った値を応答の `X-Trace-ID` ヘッダーで返す（エラーの応答を含む）。
      schema:
        type: string
        pattern: '^[\x21-\x7E]{1,64}$'

  responses:
    BadRequest:
      description: |
        リクエストが不正。`cause` は次のいずれか。項目ごとの理由は `invalidParams` に入る。
        - `INVALID_MSG_FORMAT`: JSON として解釈できない
        - `INVALID_QUERY_PARAM`: クエリパラメーターの値が不正
        - `MANDATORY_IE_MISSING`: 必須項目がない
        - `MANDATORY_IE_INCORRECT`: 必須項目の値が不正
        - `OPTIONAL_IE_INCORRECT`: 任意項目の値が不正
        - `CLIENT_NOT_FOUND`: `allowedClientIds` に存在しないクライアントID がある
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    SubscriberNotFound:
      description: 加入者が存在しない。`cause` は `USER_NOT_FOUND`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ClientNotFound:
      description: AVクライアントが存在しない。`cause` は `CLIENT_NOT_FOUND`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: サーバー内部のエラー。`cause` は `SYSTEM_FAILURE`。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    Imsi:
      type: string
      pattern: '^[0-9]{5,15}$'
      example: '440100123456789'

    ClientId:
      type: integer
      format: int64
      minimum: 1

    Hex128:
      type: string
      pattern: '^[A-Fa-f0-9]{32}$'

    Sqn:
      type: string
      description: 最後に払い出した SQN（48bit）。
      pattern: '^[A-Fa-f0-9]{12}$'
      example: '000000000020'

    Amf:
      type: string
      pattern: '^[A-Fa-f0-9]{4}$'
      example: '8000'

    SqnType:
      type: string
      description: |
        SQN 増加タイプ。
        - `inc1`: SQN 全体を 1 加算する
        - `inc32`: SEQ を 1 加算し、IND は維持する
        - `inc33`: SEQ と IND を 1 ずつ加算する。複数生成時はバッチ内で IND を固定する
      enum:
        - inc1
        - inc32
        - inc33

    State:
      type: string
      description: 加入者の状態。払い出すのは `active` だけ（設計概要 §7）。
      enum:
        - active
        - inactive
        - terminated

    Subscriber:
      type: object
      required:
        - imsi
        - state
        - stateChangedAt
        - sqn
        - amf
        - sqnType
        - allowedClientIds
        - createdAt
        - updatedAt
      properties:
        imsi:
          $ref: '#/components/schemas/Imsi'
        state:
          $ref: '#/components/schemas/State'
        stateChangedAt:
          type: string
          format: date-time
          description: 状態が最後に変わった日時（登録を含む）。
        sqn:
          $ref: '#/components/schemas/Sqn'
        amf:
          $ref: '#/components/schemas/Amf'
        sqnType:
          $ref: '#/components/schemas/SqnType'
        allowedClientIds:
          type: array
          description: 許可クライアントID。昇順。削除済みクライアントの ID は含めない。
          items:
            $ref: '#/components/schemas/ClientId'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: 最終変更日時。SQN の払い出しでは更新しない。

    SubscriberCreate:
      type: object
      required:
        - imsi
        - ki
        - opc
        - state
      properties:
        imsi:
          $ref: '#/components/schemas/Imsi'
        ki:
          $ref: '#/components/schemas/Hex128'
        opc:
          $ref: '#/components/schemas/Hex128'
        state:
          type: string
          description: 登録のときの状態。`terminated` では登録できない。
          enum:
            - active
            - inactive
        sqn:
          allOf:
            - $ref: '#/components/schemas/Sqn'
          default: '000000000000'
        amf:
          allOf:
            - $ref: '#/components/schemas/Amf'
          default: '8000'
        sqnType:
          allOf:
            - $ref: '#/components/schemas/SqnType'
          default: inc32
        allowedClientIds:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/ClientId'

    SubscriberUpdate:
      type: object
      description: 変更する項目だけを指定する。`null` は指定できない。鍵と状態は変えられない。
      minProperties: 1
      properties:
        sqn:
          $ref: '#/components/schemas/Sqn'
        amf:
          $ref: '#/components/schemas/Amf'
        sqnType:
          $ref: '#/components/schemas/SqnType'
        allowedClientIds:
          type: array
          items:
            $ref: '#/components/schemas/ClientId'

    StateChange:
      type: object
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/State'
        reason:
          type: string
          maxLength: 500
          description: 任意の理由（監査ログに残す）。

    Reinstate:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 戻す理由（必須。空白だけは不可。監査ログに残す）。

    SubscriberKeys:
      type: object
      required:
        - ki
        - opc
      properties:
        ki:
          $ref: '#/components/schemas/Hex128'
        opc:
          $ref: '#/components/schemas/Hex128'

    BatchGetRequest:
      type: object
      required: [imsis]
      properties:
        imsis:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/Imsi'

    BatchGetResult:
      type: object
      required: [items, notFound]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscriber'
        notFound:
          type: array
          items:
            $ref: '#/components/schemas/Imsi'

    SubscriberList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscriber'
        total:
          type: integer
          description: '`prefix` に一致する加入者の総数。`prefix` 省略時は全加入者数。'
        nextCursor:
          type: string
          description: 次のページがある場合だけ返す。

    CertPem:
      type: string
      description: PEM 形式の X.509 証明書。
      example: |
        -----BEGIN CERTIFICATE-----
        ...
        -----END CERTIFICATE-----

    NetworkName:
      type: string
      description: EAP-AKA' の鍵導出に使う Network Name。空文字列なら既定値の `WLAN` を使う。
      maxLength: 255
      example: WLAN

    Client:
      type: object
      required:
        - id
        - name
        - certPem
        - fingerprintSha256
        - subject
        - notBefore
        - notAfter
        - enabled
        - networkName
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/ClientId'
        name:
          type: string
        certPem:
          $ref: '#/components/schemas/CertPem'
        fingerprintSha256:
          type: string
          description: 証明書（DER）の SHA-256。
          pattern: '^[a-f0-9]{64}$'
        subject:
          type: string
          description: 証明書の Subject。表示用。
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        enabled:
          type: boolean
          description: '`false` なら接続を拒否する。'
        networkName:
          $ref: '#/components/schemas/NetworkName'
        createdAt:
          type: string
          format: date-time




    ClientList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Client'

    ServerCertificate:
      type: object
      required:
        - certPem
        - source
        - fingerprintSha256
        - subject
        - notBefore
        - notAfter
        - updatedAt
      properties:
        certPem:
          $ref: '#/components/schemas/CertPem'
        source:
          type: string
          description: 自動生成の自己署名か、持ち込みか。
          enum:
            - self-signed
            - uploaded
        fingerprintSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        subject:
          type: string
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time


    Status:
      type: object
      required:
        - version
        - bootId
        - startedAt
        - subscriberCount
        - clientCount
        - avApiContractVersion
        - avServerCertificateNotAfter
        - adminServerCertificateNotAfter
        - kekId
        - adminClients
        - adminClientsLoadedAt
      properties:
        version:
          type: string
          description: aka-vecgen のバージョン。
        bootId:
          type: string
          description: 起動ごとに変わる識別子。
        startedAt:
          type: string
          format: date-time
        avApiContractVersion:
          type: string
          description: 合わせている認証ベクターAPI の契約の版（aka-mvpset の docs/av-api-contract.md）。
          example: 1.0.0
        subscriberCount:
          type: integer
        clientCount:
          type: integer
        avServerCertificateNotAfter:
          type: string
          format: date-time
          description: AV用サーバー証明書の有効期限。
        adminServerCertificateNotAfter:
          type: string
          format: date-time
          description: 管理API 用サーバー証明書の有効期限。
        adminClients:
          type: array
          items:
            type: string
          description: ピンのファイルの管理クライアントの識別名（重ねず、辞書順）。
        adminClientsLoadedAt:
          type: string
          format: date-time
          description: ピンのファイルを読み込んだ日時（起動と SIGHUP）。
        kekId:
          type: string
          pattern: '^[0-9a-f]{16}$'
          description: 加入者の鍵とサーバー証明書の秘密鍵を暗号化している KEK の識別子（SHA-256 の先頭 8 バイトの 16 進）。



    AuditAction:
      type: string
      enum:
        - subscriber.create
        - subscriber.update
        - subscriber.delete
        - subscriber.state
        - subscriber.reinstate
        - subscriber.keys.read
        - client.create
        - client.update
        - client.certificate.replace
        - client.delete
        - av-server-certificate.replace
        - av-server-certificate.reset
        - admin-server-certificate.reset
        - kek.rotate
        - reload

    AuditLogEntry:
      type: object
      required:
        - id
        - time
        - operator
        - mgmtClient
        - action
        - target
        - traceId
      properties:
        id:
          type: string
          description: エントリID。
        time:
          type: string
          format: date-time
        operator:
          type: string
          description: 操作者 ID。`X-Operator-Id` が省略された場合は空文字列。
        mgmtClient:
          type: string
          description: 管理クライアントの識別名。
        action:
          $ref: '#/components/schemas/AuditAction'
        target:
          type: string
          description: 対象。IMSI、クライアントID など。
        traceId:
          type: string
          description: トレースID（`X-Trace-ID`。0.2.0）。ログの `trace_id` と同じ。0.2.0 より前に記録されたエントリでは空文字列。
        detail:
          type: object
          description: |
            変更内容。
            - 加入者の登録と削除では、その時点の `sqn`、`amf`、`sqnType` を含む。
            - 変更では、変更した項目の前後の値を含む。
            - Ki と OPc は値を含まず、変更の有無だけを含む。
          additionalProperties: true

    AuditLogList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        nextBefore:
          type: string
          description: さらに古いエントリがある場合だけ返す。

    InvalidParam:
      type: object
      required:
        - param
      properties:
        param:
          type: string
          description: 不正だった項目の名前。
        reason:
          type: string

    ProblemDetails:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        cause:
          type: string
          enum:
            - INVALID_MSG_FORMAT
            - INVALID_QUERY_PARAM
            - MANDATORY_IE_MISSING
            - MANDATORY_IE_INCORRECT
            - OPTIONAL_IE_INCORRECT
            - USER_NOT_FOUND
            - SUBSCRIBER_ALREADY_EXISTS
            - SUBSCRIBER_ACTIVE
            - SUBSCRIBER_TERMINATED
            - STATE_TRANSITION_NOT_ALLOWED
            - CLIENT_NOT_FOUND
            - CERT_ALREADY_REGISTERED
            - INVALID_CERTIFICATE
            - SYSTEM_FAILURE
        invalidParams:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InvalidParam'
