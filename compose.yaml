services:
  aka-vecgen:
    build:
      context: .
      args:
        VERSION: ${VECGEN_VERSION:-dev}
    restart: unless-stopped
    # 停止の合図からリスナーを閉じ終えるまで最大 10 秒かかる（server.go の shutdownTimeout）。
    # Docker の既定の猶予（10 秒）では強制終了と重なるので、長くする。
    stop_grace_period: 20s
    depends_on:
      valkey:
        condition: service_healthy
    # リスナーに接続できるかを確かめる（distroless のため curl はない。mTLS なので TCP の接続まで）。
    healthcheck:
      test: ["CMD", "/aka-vecgen", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    # KEK（加入者の鍵とサーバー証明書の秘密鍵を暗号化する鍵。設計概要 §8）。Valkey とは別のファイルで渡す。
    # コンテナは UID 65532 で動くので、この UID で読めるようにする（README の「起動」）。
    # 管理クライアントのピン（1 行に 識別名=フィンガープリント。設計概要 §10.1）。空でもよい。
    # 書き換えたら docker compose kill -s HUP aka-vecgen で読み直す（サーバー証明書の差し替えも同じ合図で反映する）。
    secrets:
      - kek
      - admin-clients
    environment:
      VECGEN_VALKEY_ADDR: valkey:6379
      VECGEN_VALKEY_PASSWORD: ${VALKEY_PASSWORD:?.env に VALKEY_PASSWORD を設定してください}
      VECGEN_KEK_FILE: /run/secrets/kek
      VECGEN_AV_TLS_ADDR: ":8443"
      VECGEN_AV_TLS_HOSTS: ${VECGEN_AV_TLS_HOSTS:-localhost,127.0.0.1,aka-vecgen}
      VECGEN_ADMIN_ADDR: ":9443"
      VECGEN_ADMIN_CLIENTS_FILE: /run/secrets/admin-clients
      VECGEN_ADMIN_TLS_HOSTS: ${VECGEN_ADMIN_TLS_HOSTS:-localhost,127.0.0.1,aka-vecgen}
      VECGEN_LOG_LEVEL: ${VECGEN_LOG_LEVEL:-info}
      VECGEN_AUDIT_MAX: ${VECGEN_AUDIT_MAX:-100000}
      VECGEN_AUDIT_DIR: /data/audit
      VECGEN_AUDIT_RETENTION_DAYS: ${VECGEN_AUDIT_RETENTION_DAYS:-14}
      # 鍵の読み出しの口（GET /admin/v2/subscribers/{imsi}/keys）。別の生成源への移し替えのときだけ true にする。
      VECGEN_KEY_EXPORT: ${VECGEN_KEY_EXPORT:-false}
    volumes:
      # 監査ログの日ごとのファイル（audit-YYYYMMDD.jsonl。設計概要 §13.2）。監視用の PC が取りに行く。
      # コンテナは UID 65532 で動くので、この UID で書けるようにする（README の「起動」）。
      - ./audit:/data/audit
    ports:
      # Docker が公開したポートは ufw の規則を通らない。公開範囲はここのバインド先で制御する。
      - "${VECGEN_AV_TLS_PUBLISH:-127.0.0.1:8443}:8443"
      - "${VECGEN_ADMIN_PUBLISH:-127.0.0.1:9443}:9443"
    networks:
      - default
      - av

  valkey:
    image: valkey/valkey:9.1.2
    restart: unless-stopped
    # 払い出した SQN を失わないよう、AOF を書き込みごとに同期する。
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "always", "--requirepass", "${VALKEY_PASSWORD}"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - valkey-data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  kek:
    file: ./secrets/kek
  admin-clients:
    file: ./secrets/admin-clients

networks:
  # 同一ホスト上の別の compose プロジェクト（AKA-RADIUS サーバーや BFF など）が接続するためのネットワーク。
  # 相手側では external として参照し、ホスト名 aka-vecgen で接続する。Valkey はこのネットワークに出さない。
  av:
    name: ${VECGEN_SHARED_NETWORK:-aka-av}

volumes:
  valkey-data:
